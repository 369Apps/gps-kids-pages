<meta charset="utf-8" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Young+Serif&display=swap');
  :root {
    --paper: #fbf8ef; --surface: #ffffff; --ink: #14213d; --muted: #536079;
    --line: #dbe3ee; --blue: #1458d4; --yellow: #f3bd35; --red: #de4a3e;
    --green: #1faa53; --shadow: 0 14px 44px rgba(20, 33, 61, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101826; --surface: #182235; --ink: #f4f7fc; --muted: #b8c3d6;
      --line: #334159; --blue: #7ba7ff; --yellow: #ffd369; --red: #ff8176;
      --green: #4cd47e; --shadow: 0 18px 44px rgba(0, 0, 0, .28);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "DM Sans", sans-serif; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  .kicker {
    display: flex; align-items: center; gap: 10px;
    font-size: .72rem; font-weight: 800; letter-spacing: .14em; color: var(--muted);
  }
  .kicker svg { width: 34px; height: 34px; flex: none; }
  h1 {
    font-family: "Young Serif", serif; font-weight: 400;
    font-size: 2.4rem; line-height: 1.1; margin: 16px 0 10px;
  }
  .hook { color: var(--muted); font-size: 1.08rem; margin: 0 0 24px; }
  .hook strong { color: var(--ink); }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    font-weight: 800; font-size: 1.05rem; padding: 16px 18px; border-radius: 16px;
    border: none; cursor: pointer; font-family: inherit;
  }
  .btn:active { transform: scale(.98); }
  .btn-play { background: var(--blue); color: #fff; font-size: 1.2rem; padding: 20px 18px; box-shadow: var(--shadow); }
  .play-sub { text-align: center; color: var(--muted); font-size: .88rem; margin: 10px 0 30px; }
  .share-row { display: flex; gap: 10px; }
  .btn-share { background: var(--green); color: #fff; flex: 1; }
  .btn-done { background: transparent; color: var(--muted); border: 2px solid var(--line); flex: 1; }
  .btn-done.done { background: var(--yellow); border-color: var(--yellow); color: #14213d; }
  footer { margin-top: 28px; text-align: center; color: var(--muted); font-size: .82rem; }
</style>
</head>
<body>
<div class="page">
  <div class="kicker">
    <svg viewBox="0 0 96 96" fill="none" stroke-width="4" stroke-linecap="round"><circle cx="48" cy="56" r="22" stroke="var(--blue)" stroke-dasharray="1 11"/><path d="M30 26 q-9 3 -12 13" stroke="var(--red)"/><path d="M66 26 q9 3 12 13" stroke="var(--red)"/><path d="M22 36 q-12 1 -16 11" stroke="var(--red)"/><path d="M74 36 q12 1 16 11" stroke="var(--red)"/></svg>
    TONIGHT AT GPS KIDS &middot; THU SEP 24
  </div>
  <h1>Your kid is coming home loud tonight.</h1>
  <p class="hook">On purpose. They found their <strong>volume 4</strong> today, and they&rsquo;ve been waiting all day to show you.</p>

  <a class="btn btn-play" href="https://register.joingpskids.com/app/?ref=GK-SHARE">Play tonight&rsquo;s game</a>
  <p class="play-sub">Five minutes. Zero prep. They lead, you play along.</p>

  <div class="share-row">
    <button class="btn btn-share" id="shareCard" type="button">Share</button>
    <button class="btn btn-done" id="doneBtn" type="button">We did it</button>
  </div>

  <footer>GPS Kids &middot; Public Speaking Club</footer>
</div>
<script>
(function () {
  var doneBtn = document.getElementById('doneBtn');
  var KEY = 'gpsk_tonight_done_2026-09-24';
  function paint() {
    var done = false;
    try { done = localStorage.getItem(KEY) === '1'; } catch (e) {}
    doneBtn.textContent = done ? 'Done \u2713' : 'We did it';
    doneBtn.classList.toggle('done', done);
  }
  doneBtn.addEventListener('click', function () {
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
    paint();
  });
  paint();

  document.getElementById('shareCard').addEventListener('click', function () {
    var url = location.href.split('#')[0];
    var data = {
      title: 'Tonight at GPS Kids',
      text: 'My kid came home LOUD tonight (on purpose). They found their volume 4 at GPS Kids. Play the 5-minute game with yours:',
      url: url
    };
    if (navigator.share) {
      navigator.share(data).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(data.text + ' ' + url).then(function () {
        var b = document.getElementById('shareCard');
        b.textContent = 'Copied \u2713';
        setTimeout(function () { b.textContent = 'Share'; }, 2000);
      }).catch(function () {});
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(data.text + ' ' + url), '_blank');
    }
  });
})();
</script>
</body>
</html>
