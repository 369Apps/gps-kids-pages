<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Tonight’s Class Plan</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap');

    :root {
      color-scheme: light dark;
      --paper: #f7f9fc;
      --surface: #ffffff;
      --ink: #14213d;
      --muted: #536079;
      --line: #dbe3ee;
      --blue: #1458d4;
      --blue-soft: #e8f0ff;
      --yellow: #f3bd35;
      --yellow-soft: #fff3c9;
      --red: #de4a3e;
      --mint: #c8f0db;
      --green: #137a51;
      --shadow: 0 14px 44px rgba(20, 33, 61, .10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #101826;
        --surface: #182235;
        --ink: #f4f7fc;
        --muted: #b8c3d6;
        --line: #334159;
        --blue: #7ba7ff;
        --blue-soft: #20365c;
        --yellow: #ffd369;
        --yellow-soft: #4a3b19;
        --red: #ff8176;
        --mint: #1f493a;
        --green: #7ee1b6;
        --shadow: 0 18px 44px rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      line-height: 1.55;
    }
    button { font: inherit; }
    a { color: inherit; }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 64px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      min-height: 530px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      border-radius: 28px 8px 28px 8px;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 5vw, 66px);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: .82rem;
      font-weight: 700;
    }
    .chip.location { background: var(--yellow-soft); color: var(--ink); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    h1, h2, h3, p { margin-top: 0; }
    h1 {
      max-width: 680px;
      margin-bottom: 18px;
      font-family: "Newsreader", serif;
      font-size: clamp(3.1rem, 7vw, 6.2rem);
      line-height: .89;
      letter-spacing: -.055em;
    }
    .theme-line {
      max-width: 590px;
      margin-bottom: 24px;
      font-size: clamp(1.05rem, 1.7vw, 1.35rem);
      color: var(--muted);
    }
    .theme-line strong { color: var(--red); }

    .hero-note {
      display: grid;
      grid-template-columns: 5px 1fr;
      gap: 14px;
      max-width: 580px;
      padding: 16px 18px 16px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .92rem;
    }
    .hero-note::before { content: ""; background: var(--yellow); border-radius: 6px; }
    .hero-note b { color: var(--ink); }

    .hero-art {
      position: relative;
      min-height: 370px;
      background: #cfe2ff;
    }
    .hero-art img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .hero-art::after {
      content: "Hook it. Demo it. Sell it.";
      position: absolute;
      left: 18px; right: 18px; bottom: 18px;
      padding: 14px 16px;
      background: rgba(15, 30, 56, .86);
      color: white;
      font-family: "Newsreader", serif;
      font-size: clamp(1.3rem, 2.5vw, 2rem);
      line-height: 1;
      border-radius: 12px 4px 12px 4px;
    }

    .quickbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin: 24px 0 56px;
      background: var(--ink);
      color: var(--paper);
      border-radius: 6px 20px 6px 20px;
      overflow: hidden;
    }
    .quickbar div { padding: 18px 20px; border-right: 1px solid color-mix(in srgb, var(--paper) 20%, transparent); }
    .quickbar div:last-child { border-right: 0; }
    .quickbar span { display: block; margin-bottom: 2px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; opacity: .7; }
    .quickbar b { font-size: 1rem; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      margin: 0 0 22px;
    }
    h2 {
      margin-bottom: 0;
      font-family: "Newsreader", serif;
      font-size: clamp(2.2rem, 4.2vw, 4rem);
      line-height: 1;
      letter-spacing: -.035em;
    }
    .section-head p { max-width: 430px; margin-bottom: 3px; color: var(--muted); }

    .timeline {
      position: relative;
      display: grid;
      gap: 12px;
      margin-bottom: 64px;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 83px;
      top: 24px; bottom: 24px;
      width: 2px;
      background: var(--line);
    }
    .phase {
      position: relative;
      display: grid;
      grid-template-columns: 72px 60px 1fr auto;
      gap: 24px;
      align-items: start;
      width: 100%;
      padding: 22px 24px 22px 0;
      border: 1px solid var(--line);
      border-left: 0;
      border-radius: 0 18px 6px 0;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }
    .phase:hover, .phase:focus-visible { border-color: var(--blue); outline: none; }
    .phase[aria-expanded="true"] { background: var(--blue-soft); border-color: var(--blue); }
    .phase-time {
      padding-top: 2px;
      text-align: right;
      font-size: .84rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .phase-time::after {
      content: "";
      position: absolute;
      left: 77px;
      top: 28px;
      width: 13px; height: 13px;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 2px var(--blue);
    }
    .phase[aria-expanded="true"] .phase-time::after { border-color: var(--blue-soft); background: var(--red); box-shadow: 0 0 0 2px var(--red); }
    .phase-doodle { padding-top: 2px; }
    .phase-doodle svg { width: 56px; height: 56px; display: block; }
    .phase h3 { margin-bottom: 4px; font-size: 1.16rem; }
    .phase p { margin-bottom: 0; color: var(--muted); font-size: .93rem; }
    .duration { min-width: 54px; padding: 5px 8px; border-radius: 7px; background: var(--yellow-soft); font-size: .76rem; font-weight: 700; text-align: center; }
    .phase-detail {
      display: none;
      grid-column: 2 / 5;
      padding: 2px 0 4px;
      color: var(--ink);
      font-size: .94rem;
    }
    .phase[aria-expanded="true"] .phase-detail { display: block; }
    .phase-detail ul { margin: 6px 0 0; padding-left: 18px; }
    .phase-detail li + li { margin-top: 5px; }
    .say {
      margin: 11px 0 0;
      padding: 13px 15px;
      border-radius: 4px 14px 4px 14px;
      background: var(--surface);
      font-family: "Newsreader", serif;
      font-size: 1.08rem;
      line-height: 1.35;
    }
    .pledge {
      margin-top: 12px;
      padding: 18px;
      border-radius: 4px 16px 4px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .pledge p { margin: 0; color: var(--ink); }
    .pledge p + p { margin-top: 14px; }
    .pledge-title { font-family: "Newsreader", serif; font-size: 1.25rem; line-height: 1.35; }
    .pledge-call { font-weight: 700; }
    .pledge-lines { font-weight: 700; line-height: 1.7; }
    .pledge-stage { color: var(--muted); font-weight: 500; }
    .pledge-finish { font-weight: 700; }
    .pledge-notes { padding-top: 14px; border-top: 1px solid var(--line); font-size: .9rem; }

    .coach-layout {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 24px;
      align-items: start;
      margin-bottom: 62px;
    }
    .panel {
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px 6px 20px 6px;
    }
    .panel h3 { font-family: "Newsreader", serif; font-size: 1.8rem; line-height: 1; margin-bottom: 18px; }
    .materials { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; list-style: none; padding: 0; margin: 0; }
    .materials li { position: relative; padding: 11px 12px 11px 38px; background: var(--paper); border-radius: 8px; font-size: .9rem; }
    .materials li::before { content: ""; position: absolute; left: 13px; top: 13px; width: 14px; height: 14px; border: 2px solid var(--green); border-radius: 3px; }

    .timer-panel { background: var(--ink); color: var(--paper); }
    .timer-panel h3 { color: var(--paper); }
    .timer-display { margin: 8px 0 18px; font-variant-numeric: tabular-nums; font-size: clamp(3.2rem, 8vw, 5.8rem); line-height: .9; font-weight: 700; letter-spacing: -.06em; }
    .timer-label { color: color-mix(in srgb, var(--paper) 72%, transparent); font-size: .86rem; }
    .timer-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .timer-actions button, .copy-btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--yellow);
      color: #182235;
      font-weight: 700;
      cursor: pointer;
    }
    .timer-actions button.secondary { background: color-mix(in srgb, var(--paper) 14%, transparent); color: var(--paper); }

    .pitch-card {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 22px;
      align-items: center;
      margin-bottom: 24px;
      padding: 28px;
      background: var(--yellow-soft);
      border-radius: 6px 24px 6px 24px;
    }
    .pitch-card .big { font-family: "Newsreader", serif; font-size: 4.4rem; line-height: .8; color: var(--red); text-align: center; }
    .pitch-card h3 { margin-bottom: 8px; font-size: 1.28rem; }
    .pitch-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pitch-steps div { padding: 11px 12px; border-radius: 8px; background: var(--surface); font-size: .86rem; }
    .pitch-steps b { display: block; color: var(--blue); }

    .support-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 62px; }
    .support-card { padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px 4px 16px 4px; }
    .support-card h3 { margin-bottom: 8px; font-size: 1.08rem; }
    .support-card p { margin-bottom: 0; color: var(--muted); font-size: .92rem; }
    .support-card strong { color: var(--ink); }

    .app-game-card { padding: 24px; background: var(--mint); border: 1px solid var(--green); border-radius: 16px 4px 16px 4px; margin-bottom: 62px; }
    .app-game-card h2 { margin-bottom: 8px; font-size: 1.2rem; }
    .app-game-card p { margin: 6px 0; color: var(--muted); font-size: .92rem; }
    .app-game-card strong { color: var(--ink); }
    .app-game-card .app-link { display: inline-block; margin-top: 10px; padding: 10px 20px; border-radius: 999px; background: var(--green); color: #0c1f16; font-weight: 700; text-decoration: none; }

    .pickup {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      padding: 28px;
      background: var(--mint);
      border-radius: 24px 6px 24px 6px;
    }
    .pickup h2 { font-size: clamp(2rem, 4vw, 3.2rem); margin-bottom: 10px; }
    .pickup blockquote { margin: 0; max-width: 760px; color: var(--ink); font-family: "Newsreader", serif; font-size: 1.14rem; line-height: 1.4; }
    .copy-btn { background: var(--ink); color: var(--paper); white-space: nowrap; }
    .copy-btn.done { background: var(--green); color: var(--surface); }

    .feedback-section {
      margin-top: 24px;
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px 6px 20px 6px;
    }
    .feedback-section h2 { font-size: clamp(2rem, 4vw, 3.2rem); }
    .feedback-section p { margin: 10px 0 20px; color: var(--muted); }
    .kid-links { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .kid-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      padding: 14px 12px;
      border-radius: 8px;
      background: var(--blue);
      color: var(--surface);
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      transition: background .18s ease;
    }
    .kid-link:hover, .kid-link:focus-visible { background: var(--green); outline: 3px solid var(--yellow); outline-offset: 2px; }

    .after { margin-top: 18px; padding: 18px 22px; color: var(--muted); font-size: .86rem; text-align: center; }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; min-height: 0; }
      .hero-art { order: -1; min-height: 300px; }
      .quickbar { grid-template-columns: 1fr 1fr; }
      .quickbar div:nth-child(2) { border-right: 0; }
      .quickbar div:nth-child(-n+2) { border-bottom: 1px solid color-mix(in srgb, var(--paper) 20%, transparent); }
      .section-head { display: block; }
      .section-head p { margin-top: 10px; }
      .coach-layout { grid-template-columns: 1fr; }
      .pitch-card { grid-template-columns: 1fr; }
      .pitch-card .big { text-align: left; }
      .pickup { grid-template-columns: 1fr; }
      .copy-btn { justify-self: start; }
      .kid-links { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 20px, 1180px); padding-top: 10px; }
      .hero { border-radius: 18px 4px 18px 4px; }
      .hero-copy { padding: 24px 20px 28px; }
      h1 { font-size: clamp(3.2rem, 18vw, 4.7rem); }
      .hero-art { min-height: 245px; }
      .quickbar { margin-bottom: 44px; }
      .quickbar div { padding: 14px 12px; }
      .timeline::before { left: 13px; }
      .phase { grid-template-columns: 42px 52px 1fr; gap: 14px; padding: 18px 14px 18px 0; }
      .phase-time { writing-mode: vertical-rl; transform: rotate(180deg); font-size: .7rem; }
      .phase-time::after { left: 7px; top: 24px; }
      .duration { grid-column: 3; justify-self: start; }
      .phase-detail { grid-column: 2 / 4; }
      .materials { grid-template-columns: 1fr; }
      .panel { padding: 22px 18px; }
      .pitch-steps { grid-template-columns: 1fr; }
      .support-grid { grid-template-columns: 1fr; }
      .pickup { padding: 24px 20px; }
      .feedback-section { padding: 24px 20px; }
      .kid-links { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    @media print {
      @page { margin: 12mm; }
      body { background: white; color: #14213d; }
      .page { width: 100%; padding: 0; }
      .hero, .panel, .phase, .support-card { box-shadow: none; break-inside: avoid; }
      .hero { min-height: auto; }
      .hero-art { min-height: 260px; }
      .phase-detail { display: block !important; }
      .timer-panel { display: none; }
      .coach-layout { grid-template-columns: 1fr; }
      .pickup { background: #dcf7e7; }
      .quickbar { background: #14213d; color: white; }
    }
  
    .runbar {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      margin: 0 0 18px; padding: 14px 16px;
      background: var(--ink); color: var(--paper);
      border-radius: 14px;
    }
    .run-launch {
      border: 0; border-radius: 10px; padding: 14px 22px;
      background: var(--yellow); color: #182235;
      font-weight: 700; font-size: 1.05rem; cursor: pointer;
    }
    .runbar-note { font-size: .9rem; opacity: .75; }
    .runmode {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column;
      background: var(--paper); color: var(--ink);
    }
    .runmode[hidden] { display: none; }
    .runmode-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; border-bottom: 1px solid var(--line);
    }
    .runmode-step { font-weight: 800; font-size: .8rem; letter-spacing: .1em; color: #182235; background: var(--yellow); border-radius: 999px; padding: 7px 14px; }
    .runmode-dots { display: flex; gap: 8px; }
    .runmode-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
    .runmode-dot.on { background: var(--yellow); }
    .runmode-close {
      border: 0; background: transparent; font-size: 1.35rem; line-height: 1;
      cursor: pointer; color: var(--ink); padding: 8px 10px;
    }
    .runmode-card { flex: 1; overflow-y: auto; padding: 28px 22px; }
    .runmode-inner { max-width: 640px; margin: 0 auto; }
    .runmode-doodle { display: flex; justify-content: center; margin: 4px 0 0; }
    .runmode-doodle svg { width: 88px; height: 88px; transform: rotate(-3deg); }
    .runmode-label {
      font-family: "Newsreader", serif; font-size: clamp(2rem, 8vw, 3.2rem);
      line-height: 1; margin-bottom: 18px;
    }
    .runmode-say {
      font-family: "Newsreader", serif; font-size: clamp(1.7rem, 6.5vw, 2.6rem);
      line-height: 1.25; padding: 22px; margin-bottom: 18px;
      background: var(--yellow-soft); border: 2px dashed var(--yellow);
      border-radius: 18px 6px 18px 6px;
    }
    .runmode-do { list-style: none; padding: 0; margin: 0; }
    .runmode-do li {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 13px 4px; font-size: 1.15rem; font-weight: 600;
      border-bottom: 2px dotted var(--line);
    }
    .runmode-do li:last-child { border-bottom: 0; }
    .runmode-do li::before {
      content: ""; flex: 0 0 auto; width: 22px; height: 22px; margin-top: 3px;
      border: 2.5px solid var(--blue); border-radius: 7px 9px 7px 10px;
      transform: rotate(-2deg);
    }
    .runmode-finale { text-align: center; padding: 34px 10px; }
    .runmode-finale[hidden] { display: none; }
    .runmode-power {
      font-family: "Newsreader", serif; font-size: clamp(2.6rem, 11vw, 4.6rem);
      line-height: 1; color: var(--red); margin-bottom: 16px;
    }
    .runmode-finale p { font-size: 1.15rem; color: var(--muted); }
    .runmode-nav {
      display: flex; gap: 12px;
      padding: 14px 18px calc(16px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line); background: var(--surface);
    }
    .runmode-back {
      flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 18px;
      background: var(--paper); color: var(--ink);
      font-weight: 700; font-size: 1.05rem; cursor: pointer;
    }
    .runmode-next {
      flex: 2; border: 0; border-radius: 12px; padding: 18px;
      background: var(--yellow); color: #182235;
      font-weight: 700; font-size: 1.15rem; cursor: pointer;
    }
  </style>
  <style>
    /* ---- cards-only layout ---- */
    .class-kicker { margin: 0; padding: 14px 4px 4px; font-size: .95rem; color: var(--muted); }
    .class-head { padding: 10px 0 6px; }
    .class-head h1 {
      margin: 16px 0 10px;
      font-family: "Newsreader", serif;
      font-size: clamp(2.7rem, 10vw, 4.6rem);
      line-height: .95;
      letter-spacing: -.04em;
    }
    .itinerary-head { margin: 26px 0 16px; }
    .itinerary-head h2 { margin-bottom: 6px; }
    .itinerary-head p { margin: 0; color: var(--muted); }
    .card-note {
      margin: 12px 0 0; padding: 12px 14px;
      border-left: 4px solid var(--yellow); background: var(--paper);
      border-radius: 0 10px 10px 0;
      font-family: "Newsreader", serif; font-size: 1.04rem; line-height: 1.4;
    }
    .card-link {
      display: inline-block; margin-top: 12px; padding: 12px 20px;
      border-radius: 999px; background: var(--blue); color: #fff !important;
      font-weight: 700; text-decoration: none;
    }
    .runmode-timer {
      border: 2px solid var(--yellow); background: transparent; color: var(--ink);
      border-radius: 999px; padding: 8px 15px; font-weight: 800; font-size: .95rem;
      font-variant-numeric: tabular-nums; cursor: pointer;
    }
    .runmode-timer.running { background: var(--yellow); color: #182235; }
    .runmode-timer.done { background: var(--red); border-color: var(--red); color: #fff; }
    .runmode-note {
      margin: 18px 0 0; padding: 18px;
      border-left: 5px solid var(--yellow); background: var(--yellow-soft);
      border-radius: 0 14px 14px 0;
      font-family: "Newsreader", serif; font-size: 1.28rem; line-height: 1.4;
    }
    .runmode-note[hidden], .runmode-link[hidden] { display: none; }
    .runmode-link {
      display: inline-block; margin-top: 16px; padding: 16px 28px;
      border-radius: 999px; background: var(--blue); color: #fff !important;
      font-weight: 700; font-size: 1.12rem; text-decoration: none;
    }
    @media print {
      .runbar { display: none; }
      .phase-detail { display: block !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="class-head">

    const phases = [...document.querySelectorAll('.phase')];

        const open = phase.getAttribute('aria-expanded') === 'true';
        phases.forEach(p => p.setAttribute('aria-expanded', 'false'));
        phase.setAttribute('aria-expanded', String(!open));
        if (!open && window.innerWidth < 600) phase.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  </script>

  <script>
    (function () {
      const dataEl = document.getElementById('runData');
      const launch = document.getElementById('runLaunch');
      if (!dataEl || !launch) return;
      const data = JSON.parse(dataEl.textContent);
      const overlay = document.getElementById('runMode');
      const stepLabel = document.getElementById('runStepLabel');
      const dots = document.getElementById('runDots');
      const runDoodle = document.getElementById('runDoodle');
      const runLabel = document.getElementById('runLabel');
      const runSay = document.getElementById('runSay');
      const runDo = document.getElementById('runDo');
      const runPhase = document.getElementById('runPhase');
      const doodles = [
        '<svg viewBox="0 0 96 96" fill="none" stroke-width="4" stroke-linecap="round"><circle cx="48" cy="56" r="22" stroke="var(--blue)" stroke-dasharray="1 11"/><path d="M30 26 q-9 3 -12 13" stroke="var(--red)"/><path d="M66 26 q9 3 12 13" stroke="var(--red)"/><path d="M22 36 q-12 1 -16 11" stroke="var(--red)"/><path d="M74 36 q12 1 16 11" stroke="var(--red)"/></svg>',
        '<svg viewBox="0 0 96 96" fill="none" stroke-width="4" stroke-linecap="round"><path d="M18 68 a34 34 0 0 1 60 0" stroke="var(--blue)"/><path d="M28 54 l-5 -8 M40 42 l-2 -10 M56 42 l2 -10 M68 54 l5 -8" stroke="var(--blue)"/><path d="M48 68 L66 46" stroke="var(--red)"/><circle cx="48" cy="68" r="4.5" fill="var(--red)" stroke="none"/></svg>',
        '<svg viewBox="0 0 96 96" fill="none" stroke-width="4" stroke-linecap="round"><g transform="rotate(-4 48 48)"><rect x="20" y="26" width="56" height="44" rx="7" stroke="var(--blue)"/><path d="M30 40 h36 M30 50 h36 M30 60 h22" stroke="var(--red)"/></g></svg>',
        '<svg viewBox="0 0 96 96" fill="none" stroke-width="4" stroke-linecap="round"><rect x="38" y="12" width="20" height="34" rx="10" stroke="var(--blue)"/><path d="M43 22 h10 M43 30 h10" stroke="var(--blue)" stroke-width="2.5"/><path d="M30 40 q0 22 18 22 q18 0 18 -22" stroke="var(--blue)"/><path d="M48 62 v12 M38 80 h20" stroke="var(--red)"/></svg>',
        '<svg viewBox="0 0 96 96" fill="none" stroke="var(--red)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M48 10 l8 21 22 1 -17 14 6 21 -19 -12 -19 12 6 -21 -17 -14 22 -1 z"/></svg>'
      ];
      const runTimer = document.getElementById('runTimer');
      const runNote = document.getElementById('runNote');
      const runLink = document.getElementById('runLink');
      let tLeft = 0, tInt = null;
      function fmtT(s) {
        const m = Math.floor(s / 60).toString().padStart(2, '0');
        const sec = (s % 60).toString().padStart(2, '0');
        return m + ':' + sec;
      }
      function stopT() {
        if (tInt) clearInterval(tInt);
        tInt = null;
        runTimer.classList.remove('running');
      }
      function setT(min) {
        stopT();
        tLeft = min * 60;
        runTimer.textContent = fmtT(tLeft);
        runTimer.classList.remove('done');
      }
      runTimer.addEventListener('click', function () {
        if (tInt) { stopT(); return; }
        if (tLeft <= 0) return;
        runTimer.classList.add('running');
        tInt = setInterval(function () {
          tLeft--;
          if (tLeft <= 0) {
            stopT(); tLeft = 0;
            runTimer.textContent = 'TIME';
            runTimer.classList.add('done');
            return;
          }
          runTimer.textContent = fmtT(tLeft);
        }, 1000);
      });
      const back = document.getElementById('runBack');
      const next = document.getElementById('runNext');
      const closeBtn = document.getElementById('runClose');
      const total = data.steps.length;
      let idx = 0;

      for (let i = 0; i < total; i++) {
        const d = document.createElement('span');
        d.className = 'runmode-dot';
        dots.appendChild(d);
      }

      function render() {
        Array.prototype.forEach.call(dots.children, function (d, i) {
          d.classList.toggle('on', i === idx);
        });
        const s = data.steps[idx];
        stepLabel.textContent = s.dur || (s.minutes + ' MIN');
        runDoodle.innerHTML = s.doodle || doodles[Math.min(idx, doodles.length - 1)];
        runLabel.textContent = s.label;
        runSay.textContent = s.say;
        runDo.innerHTML = '';
        s.do.forEach(function (line) {
          const li = document.createElement('li');
          li.textContent = line;
          runDo.appendChild(li);
        });
        next.innerHTML = (idx === data.steps.length - 1) ? 'DONE &#10003;' : 'NEXT &rarr;';
        setT(s.minutes);
        runTimer.style.visibility = 'visible';
        if (s.note) { runNote.textContent = s.note; runNote.hidden = false; }
        else { runNote.hidden = true; }
        if (s.link && s.link.url) {
          runLink.href = s.link.url;
          runLink.textContent = s.link.label + ' →';
          runLink.hidden = false;
        } else { runLink.hidden = true; }
        back.style.visibility = idx === 0 ? 'hidden' : 'visible';
        overlay.querySelector('.runmode-card').scrollTop = 0;
      }

      function open() { idx = 0; render(); overlay.hidden = false; document.body.style.overflow = 'hidden'; }
      function close() { overlay.hidden = true; document.body.style.overflow = ''; }

      launch.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      back.addEventListener('click', function () { if (idx > 0) { idx--; render(); } });
      next.addEventListener('click', function () { if (idx < total - 1) { idx++; render(); } else { close(); } });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !overlay.hidden) close();
      });
    })();
  </script>
</body>
</html>
